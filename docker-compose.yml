version: "3.9"

services:
  backend:
    image: wahab2825/insurance-premium-predictor-api
    container_name: insurance-backend
    ports:
      - "8000:8000"

  frontend:
    image:  wahab2825/insurance-premium-predictor-frontend
    container_name: insurance-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend